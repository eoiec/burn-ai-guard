<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>AI 防护 · 烫伤判读</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="apple-touch-icon" href="/app/icons/icon-192.png">
<link rel="icon" href="/app/icons/icon-192.png">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>

<!-- ================= 顶部状态栏 ================= -->
<header class="appbar" id="appbar">
  <div class="brand">
    <div class="brand-logo">✚</div>
    <div class="brand-txt">
      <b id="barTitle">AI 防护</b>
      <span id="barSub">家庭热液烫伤 AI 判读</span>
    </div>
  </div>
  <button class="icon-btn" id="btnOnline" title="服务状态"><i class="dot" id="netDot"></i></button>
</header>

<main id="main">

  <!-- ================= 判读 ================= -->
  <section class="view" id="v-scan">
    <div class="hero">
      <h2>拍一张创面照片<br><em>AI 秒级判读深度</em></h2>
      <p>浅度 · 深二度 · 三度 三分类，置信度不足自动转烧伤科医生复核</p>
    </div>

    <div class="shoot">
      <button class="shoot-btn" id="btnCamera">
        <span class="shoot-ico">📷</span>
        <span class="shoot-t">拍照判读</span>
        <span class="shoot-s">对准创面，光线充足</span>
      </button>
      <button class="album-btn" id="btnAlbum">从相册选择</button>
      <input type="file" id="fileInput" accept="image/*" capture="environment" hidden>
    </div>

    <div class="card" id="previewCard" hidden>
      <div class="preview">
        <img id="previewImg" alt="创面照片">
        <button class="preview-x" id="btnRetake">重拍</button>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><b>创面信息</b><span class="hint">选填，用于分级送医</span></div>
      <div class="field">
        <label>受伤部位</label>
        <div class="chips" data-key="site">
          <button data-v="hand_foot">手/足</button>
          <button data-v="arm_leg">四肢</button>
          <button data-v="trunk">躯干</button>
          <button data-v="face_neck">面颈</button>
          <button data-v="joint">关节</button>
          <button data-v="perineum">会阴</button>
        </div>
      </div>
      <div class="field">
        <label>烫伤面积（约几个手掌）</label>
        <div class="chips" data-key="area_hand">
          <button data-v="1">1 掌</button>
          <button data-v="3">3 掌</button>
          <button data-v="5">5 掌</button>
          <button data-v="10">10 掌+</button>
        </div>
      </div>
      <div class="field">
        <label>伤者人群</label>
        <div class="chips" data-key="age_group">
          <button data-v="adult">成人</button>
          <button data-v="child">儿童</button>
          <button data-v="elder">老人</button>
          <button data-v="infant">婴幼儿</button>
        </div>
      </div>
      <div class="field">
        <label>致伤原因</label>
        <div class="chips" data-key="cause">
          <button data-v="hot_liquid">热水/热汤</button>
          <button data-v="steam">蒸汽</button>
          <button data-v="oil">热油</button>
          <button data-v="other">其他</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><b>有没有以下情况？</b><span class="hint">任一条都会升级送医</span></div>
      <div class="flags" id="flagList"></div>
    </div>

    <button class="cta" id="btnAnalyze" disabled>开始 AI 判读</button>
    <p class="foot-note">本工具为辅助判读，不替代医生诊断。危急情况请立即拨打 120。</p>
  </section>

  <!-- ================= 结果 ================= -->
  <section class="view" id="v-result" hidden>
    <button class="back" id="btnBackScan">‹ 返回</button>
    <div id="resultBody"></div>
  </section>

  <!-- ================= 记录 ================= -->
  <section class="view" id="v-history" hidden>
    <h2 class="page-t">我的判读记录</h2>
    <p class="page-s">仅保存在本机，用于复诊对照</p>
    <div id="historyList"></div>
  </section>

  <!-- ================= 医生复核 ================= -->
  <section class="view" id="v-doctor" hidden>
    <div id="docLogin">
      <h2 class="page-t">医生复核台</h2>
      <p class="page-s">处理低置信度转人工工单</p>
      <div class="card">
        <div class="field"><label>账号</label><input id="docUser" value="doctor" autocomplete="username"></div>
        <div class="field"><label>口令</label><input id="docPass" type="password" placeholder="burn2026" autocomplete="current-password"></div>
        <button class="cta small" id="btnLogin">登录</button>
        <p class="err" id="loginErr"></p>
      </div>
    </div>
    <div id="docList" hidden>
      <div class="stat-row" id="docStats"></div>
      <div class="tabs-mini">
        <button class="on" data-st="pending">待复核</button>
        <button data-st="done">已完成</button>
        <button data-st="all">全部</button>
      </div>
      <div id="ticketList"></div>
    </div>
    <div id="docDetail" hidden></div>
  </section>

  <!-- ================= 我的 ================= -->
  <section class="view" id="v-me" hidden>
    <h2 class="page-t">设置与关于</h2>

    <div class="card">
      <div class="card-h"><b>服务地址</b><span class="hint">同一 WiFi 下的电脑 IP</span></div>
      <div class="field">
        <input id="apiBase" placeholder="例：192.168.1.8:5000" autocapitalize="off" autocorrect="off">
      </div>
      <div class="row2">
        <button class="btn ghost" id="btnTestApi">测试连接</button>
        <button class="btn primary" id="btnSaveApi">保存</button>
      </div>
      <p class="err" id="apiMsg"></p>
    </div>

    <div class="card">
      <div class="card-h"><b>模型状态</b></div>
      <div id="meModel" class="kv"></div>
    </div>

    <div class="card">
      <div class="card-h"><b>可用性评测</b><span class="hint">SUS 量表，10 题约 1 分钟</span></div>
      <a class="btn ghost block" id="btnSus" href="/sus.html">填写 SUS 问卷</a>
      <a class="btn ghost block" id="btnModelCard" href="/model.html">查看模型卡</a>
    </div>

    <p class="foot-note">AI 防护 v1.0 · 演示版模型，不具临床效力</p>
  </section>

</main>

<!-- ================= 底部导航 ================= -->
<nav class="tabbar">
  <button class="tab on" data-tab="scan">
    <span class="ti">🩹</span><span>判读</span>
  </button>
  <button class="tab" data-tab="history">
    <span class="ti">🗂</span><span>记录</span>
  </button>
  <button class="tab" data-tab="doctor">
    <span class="ti">🩺</span><span>复核</span>
  </button>
  <button class="tab" data-tab="me">
    <span class="ti">⚙️</span><span>我的</span>
  </button>
</nav>

<div class="toast" id="toast"></div>

<script src="/app/app.js"></script>
</body>
</html>
